# Local Supabase stack configuration for isolated development and CI tests.
# This file contains no linked production project ID or secrets.
project_id = "ai-notebook-studio-v5"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320

[studio]
enabled = false
port = 54323

[inbucket]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
enable_signup = false

[auth.email]
enable_signup = false
