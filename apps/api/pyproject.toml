[project]
name = "ai-notebook-studio-api"
version = "0.3.0"
description = "Modular API foundation for AI Notebook Studio V6"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.128,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.13,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "uvicorn[standard]>=0.48,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=9.0,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "pytest-cov>=7.0,<8.0",
  "ruff>=0.14,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
