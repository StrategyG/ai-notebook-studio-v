name: RAG Retrieval Evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: rag-evaluation
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: production
      RAG_ENABLED: "true"
      DATABASE_URL: ${{ secrets.RAG_EVAL_DATABASE_URL }}
      EMBEDDING_API_URL: ${{ secrets.EMBEDDING_API_URL }}
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
      EMBEDDING_DIMENSIONS: "1536"
      EMBEDDING_TIMEOUT_SECONDS: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run real-provider retrieval and citation evaluation
        run: |
          set -o pipefail
          python scripts/evaluate_rag.py | tee rag-evaluation-report.json
      - name: Upload evaluation report
        if: always() && hashFiles('apps/api/rag-evaluation-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: rag-retrieval-evaluation
          path: apps/api/rag-evaluation-report.json
          if-no-files-found: warn
          retention-days: 30
