name: CodeQL

on:
  push:
    branches: [main, production-hardening-v1]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python API
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # The current Android source bundle contains no Java/Kotlin source files.
      # Do not report a false-positive CodeQL configuration failure; scan the
      # actual Python API now. Re-enable java-kotlin when the full Android source
      # tree is restored and has compilable source files.
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
