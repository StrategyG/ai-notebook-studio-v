name: Supabase Database CI

on:
  push:
    branches: [main, production-hardening-v1]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-db-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start isolated local Supabase stack
        run: supabase start
      - name: Lint local database schema
        run: supabase db lint --local --fail-on error
      - name: Run pgTAP RLS and schema tests
        run: supabase test db --local
