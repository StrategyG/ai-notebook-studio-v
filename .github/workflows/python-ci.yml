name: Python API CI

on:
  push:
    branches: [main, production-hardening-v1]
    paths:
      - 'apps/api/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/python-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_notebook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_notebook_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Ruff lint
        run: ruff check src tests
      - name: Unit and API contract tests
        run: pytest --cov=ai_notebook_api --cov-report=term-missing --cov-fail-under=85
      - name: Provision restricted PostgreSQL RLS test role
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ai_notebook_test
        run: |
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE app_runtime LOGIN PASSWORD 'app-test-password' NOSUPERUSER NOBYPASSRLS"
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/0001_tenant_memberships.sql
          psql "$MIGRATION_DATABASE_URL" -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO app_runtime; GRANT SELECT ON tenant_memberships TO app_runtime; INSERT INTO tenant_memberships (tenant_id, subject, role, status) VALUES ('d2719d9a-3b0a-4b8a-a95b-1a8a1efc7f8e', 'rls-user-a', 'member', 'active'), ('a8e49d50-9f30-4bde-9c6f-4a7d84b0d21c', 'rls-user-b', 'member', 'active')"
      - name: PostgreSQL row-level security integration test
        env:
          TEST_DATABASE_URL: postgresql://app_runtime:app-test-password@localhost:5432/ai_notebook_test
        run: pytest -q tests/test_postgres_rls.py
